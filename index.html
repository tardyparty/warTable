<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Society — Sol Dominion</title>
<style>
  :root{
    --void:#04060d;
    --gold:#d8b04a;
    --gold-dim:#8a7434;
    --crimson:#c1352b;
    --bone:#e9e4d6;
    --slate:#6f7890;
    --panel:rgba(8,11,20,.92);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--void)}
  body{
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    color:var(--bone);
  }
  canvas{display:block}
  ::selection{background:var(--gold);color:var(--void)}

  /* ---------- header ---------- */
  #masthead{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:18px 22px 10px;
    pointer-events:none;
    background:linear-gradient(to bottom,rgba(4,6,13,.85),rgba(4,6,13,0));
  }
  #masthead h1{
    font-size:clamp(15px,2.2vw,21px);
    letter-spacing:.42em;text-transform:uppercase;font-weight:600;
    color:var(--gold);
  }
  #masthead .sub{
    margin-top:5px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--slate);
  }
  #masthead .rule{
    margin-top:10px;height:1px;max-width:340px;
    background:linear-gradient(to right,var(--gold-dim),transparent);
  }

  /* ---------- labels ---------- */
  .tag{
    position:absolute;z-index:5;transform:translate(-50%,-130%);
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--bone);opacity:.78;cursor:pointer;white-space:nowrap;
    padding:3px 7px;user-select:none;-webkit-user-select:none;
    text-shadow:0 0 6px rgba(0,0,0,.9);
    transition:color .15s,opacity .15s;
  }
  .tag::after{
    content:'';position:absolute;left:50%;top:100%;width:1px;height:9px;
    background:currentColor;opacity:.5;
  }
  .tag:hover{color:var(--gold);opacity:1}
  .tag.ship{color:var(--crimson);opacity:.92}
  .tag.ship:hover{color:#ff6a5c}
  .tag.sel{color:var(--gold);opacity:1}

  /* ---------- dossier panel ---------- */
  #dossier{
    position:fixed;top:0;right:0;bottom:0;z-index:30;
    width:min(360px,92vw);
    background:var(--panel);
    border-left:1px solid rgba(216,176,74,.35);
    backdrop-filter:blur(8px);
    transform:translateX(105%);
    transition:transform .45s cubic-bezier(.22,.9,.3,1);
    display:flex;flex-direction:column;
  }
  #dossier.open{transform:translateX(0)}
  #dossier .inner{padding:26px 26px 20px;overflow-y:auto}
  #dossier .eyebrow{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--crimson);
  }
  #dossier h2{
    margin-top:8px;font-size:27px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);font-weight:600;line-height:1.15;
  }
  #dossier .laurel{
    margin:14px 0 18px;height:1px;
    background:linear-gradient(to right,var(--gold-dim),transparent 85%);
    position:relative;
  }
  #dossier .laurel::before{
    content:'◆';position:absolute;left:0;top:-7px;font-size:9px;color:var(--gold);
  }
  dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin-bottom:20px}
  dt{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--slate);padding-top:2px;white-space:nowrap;
  }
  dd{font-size:13.5px;color:var(--bone);line-height:1.45}
  #dossier p{font-size:13.5px;line-height:1.7;color:#c9c3b4}
  #dossier p + p{margin-top:10px}
  #closeBtn{
    position:absolute;top:14px;right:14px;
    background:none;border:1px solid rgba(216,176,74,.4);color:var(--gold);
    width:30px;height:30px;cursor:pointer;font-size:14px;line-height:1;
    font-family:inherit;
  }
  #closeBtn:hover,#closeBtn:focus-visible{background:rgba(216,176,74,.15)}
  button:focus-visible,.tag:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- nav strip ---------- */
  #nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:flex;gap:4px;align-items:center;
    padding:12px 16px 14px;overflow-x:auto;
    background:linear-gradient(to top,rgba(4,6,13,.9),rgba(4,6,13,0));
    scrollbar-width:none;
  }
  #nav::-webkit-scrollbar{display:none}
  #nav button{
    flex:0 0 auto;background:none;border:1px solid transparent;
    color:var(--slate);cursor:pointer;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    padding:6px 10px;transition:color .15s,border-color .15s;
  }
  #nav button:hover{color:var(--bone)}
  #nav button.active{color:var(--gold);border-color:rgba(216,176,74,.45)}
  #nav button.shipBtn{color:#a04038}
  #nav button.shipBtn:hover{color:#ff6a5c}
  #nav button.shipBtn.active{color:var(--crimson);border-color:rgba(193,53,43,.5)}
  #nav .div{flex:0 0 1px;height:18px;background:rgba(216,176,74,.3);margin:0 6px}

  /* ---------- corner controls ---------- */
  #ctrls{position:fixed;top:18px;right:18px;z-index:25;display:flex;gap:8px}
  #ctrls button{
    background:rgba(8,11,20,.7);border:1px solid rgba(216,176,74,.35);
    color:var(--gold);cursor:pointer;padding:7px 12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  }
  #ctrls button:hover{background:rgba(216,176,74,.15)}

  #hint{
    position:fixed;left:22px;bottom:64px;z-index:15;pointer-events:none;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--slate);opacity:.85;line-height:1.9;
    transition:opacity 1s;
  }
  @media (max-width:640px){
    #hint{display:none}
    #masthead{padding:14px 14px 8px}
    #ctrls{top:auto;bottom:58px;right:12px}
  }
</style>
</head>
<body>

<header id="masthead">
  <h1>The Society · Sol Dominion</h1>
  <div class="sub">War table holo — strategic chart of the system, Year 754 PCE</div>
  <div class="rule"></div>
</header>

<div id="ctrls">
  <button id="pauseBtn" type="button">Pause</button>
  <button id="resetBtn" type="button">Reset view</button>
</div>

<div id="hint">
  drag — rotate chart<br>
  scroll / pinch — zoom<br>
  tap a body or ship — open dossier
</div>

<nav id="nav" aria-label="Bodies and ships"></nav>

<aside id="dossier" aria-live="polite">
  <button id="closeBtn" aria-label="Close dossier" type="button">✕</button>
  <div class="inner">
    <div class="eyebrow" id="dEyebrow"></div>
    <h2 id="dName"></h2>
    <div class="laurel"></div>
    <dl id="dStats"></dl>
    <div id="dBody"></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   DATA — bodies & ships of the Red Rising system
   ============================================================ */
const BODIES = [

    body:`Humanity\u2019s birthplace, conquered from Luna when the Golds turned on their makers in the great betrayal that founded the Society. In Darrow\u2019s age it is a quiet province; the system\u2019s wars are fought above it, not for it.`,

    stats:{ 'Capital':'Agea, in the Valles Marineris', 'Famed for':'Lykos mine — birthplace of Darrow of Lykos', 'Allegiance':'First world of the Rising', 'Beneath':'Helium-3 veins dug by generations of Reds' },
    body:`Terraformed by the sweat of Reds who were told the surface was still poison. Darrow was born a Helldiver of Lykos beneath this soil, was carved into a Gold at the Institute of Agea, and raised the howl of Ares that broke the Society.`,

        body:`Less a moon than a city in the sky — a warren of docks, markets, and lowColor districts wrapped around captured rock. Whoever holds Phobos holds the high ground over Mars.` },

    color:0x8a8378,
    stats:{ 'Held by':'No one for long', 'Famed for':'Smuggler havens, Syndicate routes, hidden yards', 'Notable':'Where the Sons of Ares hid what the Society could not find' },
    body:`A million cold rocks between Core and Rim. Pirates, Syndicate thorns, and rebels have always known its shadows better than any Sovereign\u2019s fleet — more than one secret warship has slipped out of the Belt to change history.`

    id:'jupiter', name:'Jupiter', eyebrow:'Planet · Gate of the Rim',

    color:0xc8a070,
    stats:{ 'Held by':'The Rim Dominion — House Raa', 'Famed for':'The Dockyards of Ganymede', 'Conflict':'Battle of Ilium — Darrow\u2019s gambit at the docks' },
    body:`The great banded sentinel of the outer system. Around its moons the Rim Dominion built its strength, and here Darrow burned his name into history with the boldest fleet action of the war.`,

        body:`The Dockyards of Ganymede could birth a navy in a year. When Darrow came to Ilium, every power in the system learned that whoever holds these slipways holds tomorrow\u2019s war.` },

        radius:.95, distance:22.5, speed:.023, color:0x8e8276,

        body:`Old, scarred, and watchful — the outermost of the great four, where Rim destroyers drill in the dark.` }

  {

    type:'planet', radius:7, distance:242, speed:.0045, spin:.008,
    color:0xd8c08a, ring:true,
    stats:{ 'Held by':'The Rim Dominion', 'Famed for':'The rings — and the grief of Rhea', 'Allegiance':'Sworn to the Raa' },
    body:`Beautiful and bitter. Saturn\u2019s moons remember what the Core would rather forget: that the Society\u2019s peace was kept with fire.`,
    moons:[
      { id:'titan', name:'Titan', eyebrow:'Moon · Veiled World',
        radius:1.0, distance:13.5, speed:.03, color:0xc89a52,
        stats:{ 'Famed for':'Methane hazes, hardest soldiers of the Rim' },
        body:`Wrapped in orange haze, Titan breeds Golds who think Luna soft and even Io comfortable.` },
      { id:'rhea', name:'Rhea', eyebrow:'Moon · The First to Burn',
        radius:.62, distance:10, speed:.038, color:0x6e6a66,
        stats:{ 'Status':'Scorched', 'Conflict':'Nuked by Octavia au Lune to end the first Rim rebellion', 'Legacy':'The wound that made the Rim what it is' },
        body:`When the Rim first rose against Luna, the Sovereign answered with atomics. Rhea burned, and a generation of the outer worlds was raised on its ashes. Every Rim oath since has been sworn in its shadow.` }
    ]
  },
  {
    id:'uranus', name:'Uranus', eyebrow:'Planet · Far Marches',
    type:'planet', radius:4.5, distance:286, speed:.0033, spin:.006,
    color:0x9fd2d8,
    stats:{ 'Held by':'Rim Dominion — thinly', 'Famed for':'Cold harvests, long silences' },
    body:`So far from Luna that its tithe ships take years. Out here the Society was always more rumor than law.`,
    moons:[]
  },
  {
    id:'neptune', name:'Neptune', eyebrow:'Planet · The Deep',
    type:'planet', radius:4.4, distance:322, speed:.0027, spin:.006,
    color:0x4a6ed0,
    stats:{ 'Held by':'Rim Dominion — in name', 'Famed for':'Last great anchorage before the dark' },
    body:`Storm-blue and remote. Fleets that wish to vanish from the system\u2019s wars have been known to winter in Neptune\u2019s shadow.`,
    moons:[
      { id:'triton', name:'Triton', eyebrow:'Moon · Frontier Hold',
        radius:.8, distance:9.5, speed:.03, color:0xc8d4d8,
        stats:{ 'Famed for':'Nitrogen ice, exile postings' },
        body:`A retrograde wanderer captured long ago — fitting home for the Society\u2019s exiles and the Rim\u2019s far watch.` }
    ]
  },
  {
    id:'pluto', name:'Pluto', eyebrow:'Dwarf Planet · The Edge',
    type:'planet', radius:.8, distance:352, speed:.0022, spin:.004,
    color:0xb8aa98,
    stats:{ 'Status':'Outpost', 'Famed for':'Where the maps of the Society end' },
    body:`Beyond Pluto there is only the long dark — and whatever humanity becomes next.`,
    moons:[]
  }
];

const SHIPS = [
  {
    id:'morningstar', name:'Morning Star', eyebrow:'Warship · Flagship of the Rising',
    anchor:'mars', orbit:9.5, speed:.025, scale:1.0, hue:0xc1352b,
    stats:{ 'Class':'MoonBreaker-class dreadnought', 'Commander':'Darrow of Lykos — the Reaper', 'Built':'In secret, by the Sons of Ares', 'Famed for':'Carrying the Rising from Mars to the gates of Luna' },
    body:`The hammer of the Rising. Hidden from the Society until the hour it was needed, the Morning Star became Darrow\u2019s home, his weapon, and the most feared silhouette in the system — Howlers prowling its halls, a wolf banner at its prow.`
  },
  {
    id:'archimedes', name:'Archimedes', eyebrow:'Torchship · Smuggler\u2019s Blade',
    anchor:'jupiter', orbit:27, speed:.02, scale:.55, hue:0xd8b04a,
    stats:{ 'Class':'Swift torchship / runner', 'Crew':'Darrow\u2019s Howlers on covert runs', 'Helm':'Colloway xe Char, ace of aces', 'Famed for':'The secret voyage to the Rim' },
    body:`Small, fast, and far too clever to catch. When the Republic\u2019s heroes had to disappear — to the Rim, through blockades, past everything hunting them — they went aboard the Archimedes and trusted the best pilot alive to thread the dark.`
  },
  {
    id:'lightbringer', name:'Lightbringer', eyebrow:'Warship · Titan of the Society',
    anchor:'mercury', orbit:7.5, speed:.03, scale:1.25, hue:0xe8d490,
    stats:{ 'Class':'Super-dreadnought — largest warship ever laid down', 'Built for':'Atalantia au Grimmus and the Ash Armada', 'Fate':'Taken by the Reaper, turned against its makers', 'Famed for':'A fortress that blots out stars' },
    body:`The Society\u2019s answer to its own twilight: a vessel so vast it is less a ship than a moving citadel. Forged to end the Rising at Mercury — and instead made legend when Darrow seized it and renamed the future.`
  }
];

/* ============================================================
   SCENE
   ============================================================ */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 5000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x303a50,.85));
const sunLight = new THREE.PointLight(0xffe2b0,1.6,0,2);
scene.add(sunLight);

/* starfield */
(function(){
  const n=2600, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r=900+Math.random()*1800, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.cos(p); pos[i*3+2]=r*Math.sin(p)*Math.sin(t);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xbfc6d8,size:1.4,sizeAttenuation:false,transparent:true,opacity:.7})));
})();

/* glow sprite helper */
function glowTexture(inner,outer){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,inner);g.addColorStop(.4,outer);g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

const selectable=[];   // {obj, data, kind}
const labels=[];       // {el, obj, data, kind, parentBody}
const orbiters=[];     // {pivot, speed}
const spinners=[];     // {mesh, spin}

function makeLabel(text, kind, target){
  const el=document.createElement('button');
  el.className='tag'+(kind==='ship'?' ship':'');
  el.textContent=text;
  el.style.background='none';el.style.border='none';
  el.addEventListener('click',e=>{e.stopPropagation();select(target);});
  document.body.appendChild(el);
  return el;
}

function makeBody(d, parentObj, isMoon){
  const pivot=new THREE.Object3D();
  (parentObj||scene).add(pivot);
  pivot.rotation.y=Math.random()*Math.PI*2;

  let mesh;
  if(d.type==='star'){
    mesh=new THREE.Mesh(new THREE.SphereGeometry(d.radius,48,48),
      new THREE.MeshBasicMaterial({color:d.color}));
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture('rgba(255,214,130,.9)','rgba(216,140,40,.35)'),transparent:true,depthWrite:false}));
    sp.scale.set(d.radius*7,d.radius*7,1);
    mesh.add(sp);
  } else {
    mesh=new THREE.Mesh(new THREE.SphereGeometry(d.radius,40,40),
      new THREE.MeshStandardMaterial({color:d.color,roughness:.85,metalness:.05}));
  }
  mesh.position.x=d.distance;
  pivot.add(mesh);

  if(d.ring){
    const rg=new THREE.RingGeometry(d.radius*1.5,d.radius*2.5,72);
    const rm=new THREE.MeshBasicMaterial({color:0xcab884,side:THREE.DoubleSide,transparent:true,opacity:.4});
    const ring=new THREE.Mesh(rg,rm);
    ring.rotation.x=Math.PI/2.25;
    mesh.add(ring);
  }

  /* orbit line */
  if(d.distance>0 && d.type!=='belt'){
    const seg=128, pts=[];
    for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*d.distance,0,Math.sin(a)*d.distance));}
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:isMoon?0x3a4258:0x55482c,transparent:true,opacity:isMoon?.5:.6}));
    (parentObj||scene).add(line);
  }

  const kind=isMoon?'moon':d.type;
  selectable.push({obj:mesh,data:d,kind});
  if(d.type!=='belt'){
    labels.push({el:makeLabel(d.name,kind,d), obj:mesh, data:d, kind, parent:parentObj?parentObj.userData.bodyId:null});
  }
  orbiters.push({pivot,speed:d.speed});
  if(d.spin) spinners.push({mesh,spin:d.spin});
  mesh.userData.bodyId=d.id;

  d._mesh=mesh;

  (d.moons||[]).forEach(m=>{m.type='moon';makeBody(m,mesh,true);});
  return mesh;
}

BODIES.forEach(b=>{
  if(b.type==='belt'){
    /* belt as a particle ring + invisible click anchor */
    const n=900,pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,r=b.distance-8+Math.random()*16;
      pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-.5)*3;pos[i*3+2]=Math.sin(a)*r;
    }
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x8a8378,size:.9,transparent:true,opacity:.8})));
    const anchor=new THREE.Mesh(new THREE.SphereGeometry(.6,8,8),new THREE.MeshBasicMaterial({visible:false}));
    anchor.position.set(b.distance,0,0);
    const pivot=new THREE.Object3D();pivot.add(anchor);scene.add(pivot);
    orbiters.push({pivot,speed:b.speed});
    b._mesh=anchor;anchor.userData.bodyId=b.id;
    selectable.push({obj:anchor,data:b,kind:'belt'});
    labels.push({el:makeLabel(b.name,'belt',b),obj:anchor,data:b,kind:'belt',parent:null});
  } else makeBody(b,null,false);
});

/* ---------- ships ---------- */
function makeShip(s){
  const grp=new THREE.Group();
  const hullMat=new THREE.MeshStandardMaterial({color:0x9aa0ae,roughness:.5,metalness:.7});
  const trimMat=new THREE.MeshStandardMaterial({color:s.hue,emissive:s.hue,emissiveIntensity:.7,roughness:.4});
  const hull=new THREE.Mesh(new THREE.CylinderGeometry(.22,.4,2.6,8),hullMat);
  hull.rotation.z=Math.PI/2;grp.add(hull);
  const prow=new THREE.Mesh(new THREE.ConeGeometry(.22,.8,8),hullMat);
  prow.rotation.z=-Math.PI/2;prow.position.x=1.7;grp.add(prow);
  const spine=new THREE.Mesh(new THREE.BoxGeometry(1.6,.14,.7),hullMat);
  spine.position.y=.22;grp.add(spine);
  const engine=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.25,8),trimMat);
  engine.rotation.z=Math.PI/2;engine.position.x=-1.42;grp.add(engine);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture('rgba(255,200,140,.95)','rgba(200,80,40,.3)'),transparent:true,depthWrite:false}));
  glow.scale.set(1.2,1.2,1);glow.position.x=-1.7;grp.add(glow);
  grp.scale.setScalar(s.scale);
  return grp;
}

SHIPS.forEach(s=>{
  const host=BODIES.find(b=>b.id===s.anchor)._mesh;
  const pivot=new THREE.Object3D();
  pivot.rotation.y=Math.random()*Math.PI*2;
  pivot.rotation.x=(Math.random()-.5)*.4;
  host.add(pivot);
  const ship=makeShip(s);
  ship.position.x=s.orbit;
  ship.rotation.y=Math.PI/2;
  pivot.add(ship);
  orbiters.push({pivot,speed:s.speed});
  s._mesh=ship;
  selectable.push({obj:ship,data:s,kind:'ship'});
  labels.push({el:makeLabel(s.name,'ship',s),obj:ship,data:s,kind:'ship',parent:s.anchor});
});

/* ============================================================
   CAMERA CONTROLS (custom orbit)
   ============================================================ */
const ctrl={theta:.9,phi:1.12,dist:430,focus:null,focusRadius:16};
const camTarget=new THREE.Vector3();
const desired=new THREE.Vector3();

function focusOn(data){
  ctrl.focus=data?data._mesh:null;
  ctrl.focusRadius=data?(data.radius||1.2*(data.scale||1)+1):16;
  if(data){
    const r=(data.radius||2)*(data.scale?4:1);
    ctrl.dist=Math.max(r*6,6);
    if(data.type==='star')ctrl.dist=70;
    if(data.id==='belt')ctrl.dist=40;
  }
}
function resetView(){
  ctrl.focus=null;ctrl.dist=430;ctrl.theta=.9;ctrl.phi=1.12;
  closeDossier();setActiveNav(null);
}

let dragging=false,px=0,py=0,moved=0;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{dragging=true;moved=0;px=e.clientX;py=e.clientY;});
addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);
  px=e.clientX;py=e.clientY;
  ctrl.theta-=dx*.005;
  ctrl.phi=Math.min(Math.PI-.15,Math.max(.15,ctrl.phi-dy*.005));
});
addEventListener('pointerup',()=>dragging=false);
el.addEventListener('wheel',e=>{
  e.preventDefault();
  ctrl.dist*=1+Math.sign(e.deltaY)*.09;
  clampDist();
},{passive:false});

/* pinch zoom */
let pinchD=0;
el.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:true});
el.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinchD)ctrl.dist*=pinchD/d;
    pinchD=d;clampDist();dragging=false;
  }
},{passive:true});
el.addEventListener('touchend',()=>{pinchD=0;});

function clampDist(){
  const min=Math.max(ctrl.focusRadius*2.2,3);
  ctrl.dist=Math.min(900,Math.max(min,ctrl.dist));
}

/* click select via raycast */
const ray=new THREE.Raycaster();const ptr=new THREE.Vector2();
el.addEventListener('click',e=>{
  if(moved>6)return;
  ptr.x=(e.clientX/innerWidth)*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const objs=selectable.map(s=>s.obj);
  const hits=ray.intersectObjects(objs,true);
  if(hits.length){
    let o=hits[0].object;
    while(o && !selectable.some(s=>s.obj===o)) o=o.parent;
    const found=selectable.find(s=>s.obj===o);
    if(found){select(found.data);return;}
  }
});

/* ============================================================
   UI — dossier & nav
   ============================================================ */
const dossier=document.getElementById('dossier');
const dEyebrow=document.getElementById('dEyebrow');
const dName=document.getElementById('dName');
const dStats=document.getElementById('dStats');
const dBody=document.getElementById('dBody');
document.getElementById('closeBtn').addEventListener('click',closeDossier);

let current=null;
function select(data){
  current=data;
  focusOn(data);
  dEyebrow.textContent=data.eyebrow;
  dName.textContent=data.name;
  dStats.innerHTML='';
  Object.entries(data.stats||{}).forEach(([k,v])=>{
    const dt=document.createElement('dt');dt.textContent=k;
    const dd=document.createElement('dd');dd.textContent=v;
    dStats.append(dt,dd);
  });
  dBody.innerHTML='';
  String(data.body||'').split('\n').forEach(t=>{
    const p=document.createElement('p');p.textContent=t;dBody.appendChild(p);
  });
  dossier.classList.add('open');
  setActiveNav(data.id);
  labels.forEach(l=>l.el.classList.toggle('sel',l.data===data));
}
function closeDossier(){
  dossier.classList.remove('open');
  labels.forEach(l=>l.el.classList.remove('sel'));
}

/* nav strip */
const nav=document.getElementById('nav');
function navBtn(data,cls){
  const b=document.createElement('button');
  b.textContent=data.name;b.dataset.id=data.id;
  if(cls)b.className=cls;
  b.addEventListener('click',()=>select(data));
  nav.appendChild(b);
}
BODIES.forEach(b=>navBtn(b));
const div=document.createElement('div');div.className='div';nav.appendChild(div);
SHIPS.forEach(s=>navBtn(s,'shipBtn'));
function setActiveNav(id){
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
}

/* pause / reset */
let timeScale=reduceMotion?0:1;
const pauseBtn=document.getElementById('pauseBtn');
if(reduceMotion)pauseBtn.textContent='Play';
pauseBtn.addEventListener('click',()=>{
  timeScale=timeScale?0:1;
  pauseBtn.textContent=timeScale?'Pause':'Play';
});
document.getElementById('resetBtn').addEventListener('click',resetView);

/* fade the hint after a while */
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity='0';},14000);

/* ============================================================
   LOOP
   ============================================================ */
const v=new THREE.Vector3();
function updateLabels(){
  const camPos=camera.position;
  labels.forEach(l=>{
    l.obj.getWorldPosition(v);
    const dCam=v.distanceTo(camPos);
    /* moons & ships only labeled when reasonably close */
    let visible=true;
    if(l.kind==='moon'||l.kind==='ship') visible=dCam<160;
    v.project(camera);
    if(v.z>1)visible=false;
    if(!visible){l.el.style.display='none';return;}
    l.el.style.display='block';
    l.el.style.left=((v.x*.5+.5)*innerWidth)+'px';
    l.el.style.top=((-v.y*.5+.5)*innerHeight)+'px';
  });
}

function animate(){
  requestAnimationFrame(animate);
  orbiters.forEach(o=>{o.pivot.rotation.y+=o.speed*.25*timeScale;});
  spinners.forEach(s=>{s.mesh.rotation.y+=s.spin*timeScale;});

  if(ctrl.focus)ctrl.focus.getWorldPosition(camTarget);
  else camTarget.set(0,0,0);

  desired.set(
    camTarget.x+ctrl.dist*Math.sin(ctrl.phi)*Math.cos(ctrl.theta),
    camTarget.y+ctrl.dist*Math.cos(ctrl.phi),
    camTarget.z+ctrl.dist*Math.sin(ctrl.phi)*Math.sin(ctrl.theta)
  );
  camera.position.lerp(desired,.08);
  camera.lookAt(camTarget);

  updateLabels();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
